<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>セキレイメン・フラッピー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        canvas {
            display: block;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 text-white overflow-hidden">

    <div class="relative w-full max-w-md flex flex-col items-center">
        <!-- Canvas Container -->
        <div class="relative w-full aspect-[2/3] max-h-[85vh] rounded-2xl overflow-hidden border-4 border-slate-700 bg-sky-300">
            <canvas id="gameCanvas" class="w-full h-full"></canvas>

            <!-- UI Overlay for Game Start / Game Over -->
            <div id="uiOverlay" class="absolute inset-0 flex flex-col items-center justify-between p-6 pointer-events-none z-10">
                <!-- Title & High Score Header -->
                <div class="text-center pt-4">
                    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-wider text-yellow-300 drop-shadow-[0_3px_3px_rgba(0,0,0,0.8)] border-b-4 border-yellow-400 pb-1">
                        セキレイメン
                    </h1>
                    <p class="text-lg font-bold text-white drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] mt-1">
                        FLAPPY BIRD
                    </p>
                </div>

                <!-- Center Prompt Message -->
                <div id="centerMessage" class="text-center bg-black/60 backdrop-blur-md px-6 py-4 rounded-xl border border-white/20 transition-all">
                    <p id="msgTitle" class="text-xl font-bold text-yellow-300 mb-1">タップでジャンプ！</p>
                    <p id="msgSub" class="text-xs text-gray-200">画面をタップ・クリックまたは<br>スペースキーを押してね</p>
                </div>

                <!-- Bottom Score Dashboard -->
                <div class="w-full bg-slate-800/80 backdrop-blur-sm rounded-xl p-3 border border-slate-600 flex justify-around text-center shadow-lg">
                    <div>
                        <div class="text-xs text-slate-400 font-bold uppercase">スコア</div>
                        <div id="currentScoreDisplay" class="text-2xl font-black text-white">0</div>
                    </div>
                    <div class="border-r border-slate-600 my-1"></div>
                    <div>
                        <div class="text-xs text-slate-400 font-bold uppercase">ハイスコア</div>
                        <div id="highScoreDisplay" class="text-2xl font-black text-yellow-400">0</div>
                    </div>
                </div>
            </div>

            <!-- Action Button overlay -->
            <div id="buttonArea" class="absolute inset-0 flex items-center justify-center pointer-events-none z-20 hidden">
                <button id="retryBtn" class="pointer-events-auto bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-300 hover:to-orange-400 text-slate-950 font-black text-xl py-3 px-8 rounded-full shadow-2xl border-2 border-yellow-200 transform active:scale-95 transition">
                    もういちど遊ぶ
                </button>
            </div>
        </div>

        <div class="mt-3 text-xs text-slate-400 text-center">
            PC: [スペース] または クリック | スマホ: タップ
        </div>
    </div>

    <script>
        // Web Audio API Synthesizer for Retro Sound Effects
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playJumpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(350, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
            
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playScoreSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
            
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playHitSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        /**
         * Procedurally draws "セキレイメン" matching the source character design:
         * - Round white head with black top cap & ear patches
         * - Large black expressive eyes with eyelashes
         * - Red cheeks
         * - Diamond black beak
         * - Sitting inside white cup bowl
         * - Red badge with emblem/logo on the bowl
         * - Green feet underneath
         */
        function drawSekireimen(ctx, x, y, width, height, rotation) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);

            const scale = width / 100;
            ctx.scale(scale, scale);

            // Center relative coordinates (-50 to +50)
            
            // 1. Green Bird Feet (Bottom)
            ctx.fillStyle = '#22c55e'; // Vibrant green
            ctx.strokeStyle = '#15803d';
            ctx.lineWidth = 2;

            // Left Foot
            ctx.beginPath();
            ctx.ellipse(-20, 42, 14, 6, -0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Right Foot
            ctx.beginPath();
            ctx.ellipse(20, 42, 14, 6, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Foot details (toes)
            ctx.beginPath();
            ctx.moveTo(-30, 42); ctx.lineTo(-10, 42);
            ctx.moveTo(10, 42); ctx.lineTo(30, 42);
            ctx.stroke();

            // 2. White Bowl / Eggshell Cup
            ctx.fillStyle = '#f8fafc';
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2.5;

            ctx.beginPath();
            ctx.moveTo(-45, -5);
            ctx.bezierCurveTo(-48, 25, -25, 40, 0, 40);
            ctx.bezierCurveTo(25, 40, 48, 25, 45, -5);
            ctx.bezierCurveTo(30, -12, -30, -12, -45, -5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Bowl Inner Shadow/Rim
            ctx.beginPath();
            ctx.ellipse(0, -5, 43, 8, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#e2e8f0';
            ctx.fill();
            ctx.stroke();

            // Wing Accents on sides (Ruffled white springs)
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#cbd5e1';
            for (let side of [-1, 1]) {
                ctx.beginPath();
                ctx.arc(side * 44, 8, 6, 0, Math.PI * 2);
                ctx.arc(side * 46, 18, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            // 3. Sekireimen Bird Head (Inside Cup)
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.arc(0, -20, 26, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Black Cap/Marking on Head Top
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(0, -20, 26, Math.PI * 1.15, Math.PI * 1.85, false);
            ctx.quadraticCurveTo(0, -32, 0, -32);
            ctx.fill();

            // Black Cheek/Side markings
            ctx.beginPath();
            ctx.arc(-20, -24, 6, 0, Math.PI * 2);
            ctx.arc(20, -24, 6, 0, Math.PI * 2);
            ctx.fill();

            // Eyes (Large black circles)
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(-13, -20, 6.5, 0, Math.PI * 2);
            ctx.arc(13, -20, 6.5, 0, Math.PI * 2);
            ctx.fill();

            // Eye lashes/details
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-18, -26); ctx.lineTo(-14, -28);
            ctx.moveTo(18, -26); ctx.lineTo(14, -28);
            ctx.stroke();

            // Red Rosy Cheeks
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(-19, -12, 5, 0, Math.PI * 2);
            ctx.arc(19, -12, 5, 0, Math.PI * 2);
            ctx.fill();

            // Beak (Black Diamond/Square)
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.moveTo(0, -18);
            ctx.lineTo(4, -14);
            ctx.lineTo(0, -10);
            ctx.lineTo(-4, -14);
            ctx.closePath();
            ctx.fill();

            // Inner beak line
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-4, -14);
            ctx.lineTo(4, -14);
            ctx.stroke();

            // 4. Red Logo Badge on Bowl Front (Red Circle with 'L' checkmark)
            ctx.fillStyle = '#dc2626'; // Bright Red
            ctx.beginPath();
            ctx.arc(0, 15, 14, 0, Math.PI * 2);
            ctx.fill();

            // Inner Circle ring
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 15, 12, 0, Math.PI * 2);
            ctx.stroke();

            // Red 'L' Logo symbol inside badge
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(-4, 9);
            ctx.lineTo(-4, 21);
            ctx.lineTo(5, 21);
            ctx.lineTo(5, 17);
            ctx.lineTo(0, 17);
            ctx.lineTo(0, 9);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const msgTitle = document.getElementById('msgTitle');
        const msgSub = document.getElementById('msgSub');
        const centerMessage = document.getElementById('centerMessage');
        const currentScoreDisplay = document.getElementById('currentScoreDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');
        const buttonArea = document.getElementById('buttonArea');
        const retryBtn = document.getElementById('retryBtn');

        // Game Dimensions
        let CANVAS_WIDTH = 360;
        let CANVAS_HEIGHT = 540;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            CANVAS_WIDTH = canvas.width;
            CANVAS_HEIGHT = canvas.height;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Game State
        const STATE = {
            START: 0,
            PLAYING: 1,
            GAMEOVER: 2
        };
        let gameState = STATE.START;

        // Scores
        let score = 0;
        let highScore = localStorage.getItem('sekireimen_high_score') || 0;
        highScoreDisplay.textContent = highScore;

        // Player (Sekireimen) Properties
        const bird = {
            x: 80,
            y: 250,
            width: 50,
            height: 50,
            gravity: 0.30, // 0.38 -> 0.30 (重力を弱くしてふんわり操作に)
            lift: -6.8,    // -7.5 -> -6.8
            velocity: 0,
            rotation: 0
        };

        // Pipe Obstacles
        const pipes = [];
        const pipeWidth = 60;
        const pipeGap = 180; // 150 -> 180 (土管の上下の隙間を拡大)
        let pipeSpawnTimer = 0;
        const pipeSpawnInterval = 120; // 100 -> 120 (土管と土管の間隔を拡大)

        // Environment Background Scroll
        let bgOffset = 0;
        let cloudOffset = 0;

        function resetGame() {
            bird.y = CANVAS_HEIGHT * 0.4;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes.length = 0;
            score = 0;
            pipeSpawnTimer = 0;
            currentScoreDisplay.textContent = score;
            
            gameState = STATE.START;
            msgTitle.textContent = "タップでジャンプ！";
            msgSub.innerHTML = "画面をタップ・クリックまたは<br>スペースキーを押してね";
            centerMessage.classList.remove('hidden');
            buttonArea.classList.add('hidden');
        }

        function jump() {
            initAudio();
            if (gameState === STATE.START) {
                gameState = STATE.PLAYING;
                centerMessage.classList.add('hidden');
            }

            if (gameState === STATE.PLAYING) {
                bird.velocity = bird.lift;
                playJumpSound();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameState === STATE.GAMEOVER && buttonArea.classList.contains('hidden') === false) {
                    resetGame();
                    jump();
                } else {
                    jump();
                }
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            jump();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        }, { passive: false });

        retryBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetGame();
            jump();
        });

        function drawBackground() {
            // Sky gradient
            const skyGradient = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
            skyGradient.addColorStop(0, '#38bdf8');
            skyGradient.addColorStop(0.7, '#bae6fd');
            skyGradient.addColorStop(1, '#e0f2fe');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Moving Clouds
            cloudOffset = (cloudOffset + 0.3) % CANVAS_WIDTH;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            
            ctx.beginPath();
            ctx.arc((20 - cloudOffset + CANVAS_WIDTH) % CANVAS_WIDTH, 80, 25, 0, Math.PI * 2);
            ctx.arc((50 - cloudOffset + CANVAS_WIDTH) % CANVAS_WIDTH, 70, 35, 0, Math.PI * 2);
            ctx.arc((80 - cloudOffset + CANVAS_WIDTH) % CANVAS_WIDTH, 80, 25, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc((220 - cloudOffset * 0.7 + CANVAS_WIDTH) % CANVAS_WIDTH, 140, 20, 0, Math.PI * 2);
            ctx.arc((245 - cloudOffset * 0.7 + CANVAS_WIDTH) % CANVAS_WIDTH, 130, 30, 0, Math.PI * 2);
            ctx.arc((270 - cloudOffset * 0.7 + CANVAS_WIDTH) % CANVAS_WIDTH, 140, 20, 0, Math.PI * 2);
            ctx.fill();

            // Distant Hills
            ctx.fillStyle = '#86efac';
            ctx.beginPath();
            ctx.moveTo(0, CANVAS_HEIGHT - 60);
            ctx.quadraticCurveTo(CANVAS_WIDTH * 0.25, CANVAS_HEIGHT - 100, CANVAS_WIDTH * 0.5, CANVAS_HEIGHT - 60);
            ctx.quadraticCurveTo(CANVAS_WIDTH * 0.75, CANVAS_HEIGHT - 110, CANVAS_WIDTH, CANVAS_HEIGHT - 60);
            ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.lineTo(0, CANVAS_HEIGHT);
            ctx.fill();

            // Ground Base
            const groundHeight = 60;
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(0, CANVAS_HEIGHT - groundHeight, CANVAS_WIDTH, groundHeight);

            // Ground Top Border Line
            ctx.fillStyle = '#15803d';
            ctx.fillRect(0, CANVAS_HEIGHT - groundHeight, CANVAS_WIDTH, 6);

            // Scrolling Ground Pattern
            bgOffset = (bgOffset + 2) % 24;
            ctx.fillStyle = '#16a34a';
            for (let i = -24; i < CANVAS_WIDTH + 24; i += 24) {
                ctx.beginPath();
                ctx.moveTo(i - bgOffset, CANVAS_HEIGHT - groundHeight + 6);
                ctx.lineTo(i - bgOffset + 12, CANVAS_HEIGHT - groundHeight + 6);
                ctx.lineTo(i - bgOffset + 6, CANVAS_HEIGHT - groundHeight + 20);
                ctx.closePath();
                ctx.fill();
            }
        }

        function drawPipes() {
            pipes.forEach(pipe => {
                // Pipe Green Colors
                const pipeGrad = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
                pipeGrad.addColorStop(0, '#4ade80');
                pipeGrad.addColorStop(0.3, '#22c55e');
                pipeGrad.addColorStop(0.8, '#15803d');
                pipeGrad.addColorStop(1, '#166534');

                // Top Pipe
                ctx.fillStyle = pipeGrad;
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
                // Top Pipe Lip
                ctx.fillRect(pipe.x - 4, pipe.top - 24, pipeWidth + 8, 24);
                ctx.strokeStyle = '#052e16';
                ctx.lineWidth = 2;
                ctx.strokeRect(pipe.x - 4, pipe.top - 24, pipeWidth + 8, 24);
                ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.top - 24);

                // Bottom Pipe
                const bottomPipeY = pipe.top + pipeGap;
                const bottomPipeHeight = CANVAS_HEIGHT - 60 - bottomPipeY;
                ctx.fillRect(pipe.x, bottomPipeY, pipeWidth, bottomPipeHeight);
                // Bottom Pipe Lip
                ctx.fillRect(pipe.x - 4, bottomPipeY, pipeWidth + 8, 24);
                ctx.strokeRect(pipe.x - 4, bottomPipeY, pipeWidth + 8, 24);
                ctx.strokeRect(pipe.x, bottomPipeY + 24, pipeWidth, bottomPipeHeight - 24);
            });
        }

        function spawnPipe() {
            const minPipeHeight = 50;
            const maxPipeHeight = CANVAS_HEIGHT - 60 - pipeGap - minPipeHeight;
            const topHeight = Math.floor(Math.random() * (maxPipeHeight - minPipeHeight + 1)) + minPipeHeight;

            pipes.push({
                x: CANVAS_WIDTH,
                top: topHeight,
                passed: false
            });
        }

        function triggerGameOver() {
            gameState = STATE.GAMEOVER;
            playHitSound();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('sekireimen_high_score', highScore);
                highScoreDisplay.textContent = highScore;
            }

            msgTitle.textContent = "ゲームオーバー！";
            msgSub.innerHTML = `最終スコア: <span class="text-xl font-bold text-yellow-300">${score}</span>`;
            centerMessage.classList.remove('hidden');
            buttonArea.classList.remove('hidden');
        }

        function update() {
            if (gameState === STATE.PLAYING) {
                // Bird Physics
                bird.velocity += bird.gravity;
                bird.y += bird.velocity;

                // Rotation based on velocity
                bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, bird.velocity * 0.08));

                // Ground Collision
                const groundY = CANVAS_HEIGHT - 60;
                if (bird.y + bird.height / 2 >= groundY) {
                    bird.y = groundY - bird.height / 2;
                    triggerGameOver();
                }

                // Ceiling Collision
                if (bird.y - bird.height / 2 <= 0) {
                    bird.y = bird.height / 2;
                    bird.velocity = 0;
                }

                // Pipe Spawning
                pipeSpawnTimer++;
                if (pipeSpawnTimer >= pipeSpawnInterval) {
                    spawnPipe();
                    pipeSpawnTimer = 0;
                }

                // Move & Collision Check with Pipes
                for (let i = pipes.length - 1; i >= 0; i--) {
                    const p = pipes[i];
                    p.x -= 1.8; // 2.2 -> 1.8 (土管のスクロール速度をダウン)

                    // Score Check
                    if (!p.passed && p.x + pipeWidth < bird.x) {
                        p.passed = true;
                        score++;
                        currentScoreDisplay.textContent = score;
                        playScoreSound();
                    }

                    // Collision Detection (Hitbox slightly smaller for forgiving gameplay)
                    const birdHitRadius = bird.width * 0.3; // 0.38 -> 0.30 (当たり判定を甘く設定)
                    const inPipeX = (bird.x + birdHitRadius > p.x) && (bird.x - birdHitRadius < p.x + pipeWidth);
                    const hitTopPipe = bird.y - birdHitRadius < p.top;
                    const hitBottomPipe = bird.y + birdHitRadius > p.top + pipeGap;

                    if (inPipeX && (hitTopPipe || hitBottomPipe)) {
                        triggerGameOver();
                    }

                    // Remove offscreen pipes
                    if (p.x + pipeWidth < -20) {
                        pipes.splice(i, 1);
                    }
                }
            } else if (gameState === STATE.START) {
                // Hover animation at start
                bird.y = CANVAS_HEIGHT * 0.4 + Math.sin(Date.now() * 0.005) * 8;
                bird.rotation = 0;
            }
        }

        function render() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw Sky & Environment
            drawBackground();

            // Draw Obstacles
            drawPipes();

            // Draw Player (Sekireimen)
            drawSekireimen(ctx, bird.x, bird.y, bird.width, bird.height, bird.rotation);
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Start animation loop on window load
        window.onload = function() {
            gameLoop();
        };
    </script>
</body>
</html>
