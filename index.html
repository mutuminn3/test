<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あすなろカンパニー ミニゲームポータル</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        /* ゲーム一覧のグリッドレイアウト */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        /* 各ゲームのカード（リンク） */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }

        .game-card h2 {
            font-size: 1.4rem;
            margin: 0 0 12px 0;
            color: var(--accent-color);
        }

        .game-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0 0 20px 0;
            line-height: 1.5;
        }

        .play-btn {
            align-self: flex-start;
            background-color: var(--accent-color);
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        footer {
            margin-top: 60px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>あすなろカンパニー ゲームプラットフォーム</h1>
        <p class="subtitle">遊ぶゲームを下のカードから選んでクリックしてね！</p>
    </header>

    <main class="game-grid">

        <!-- ========================================== -->
        <!-- ▼ ミニゲーム1のカード -->
        <!-- ========================================== -->
        <!-- href="test.html" -->
        <a href="game1/test.html" class="game-card">
            <div>
                <h2>フラッピーバード</h2>
                <p>徒競走です</p>
            </div>
            <div class="play-btn">プレイする ＞</div>
        </a>

        <!-- ========================================== -->
        <!-- ▼ ミニゲーム1のカード -->
        <!-- ========================================== -->
        <!-- href="tokyousou.html" -->
        <a href="tokyousou/tokyousou.html" class="game-card">
            <div>
                <h2>フラッピーバード</h2>
                <p>徒競走です</p>
            </div>
            <div class="play-btn">プレイする ＞</div>
        </a>

        
    </main>

    <footer>
        &copy; 2026 あすなろカンパニー
    </footer>

</body>
</html>
